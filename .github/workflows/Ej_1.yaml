name: Variable de entorno

on:
  workflow_dispatch:

env:
  VAR1: "Ciao"

jobs:
  job_1:
    runs-on: ubuntu-latest
    steps:
    - name: First Step
      run: echo "${{ env.VAR1 }} Mondo"
  job_2:
    runs-on: ubuntu-latest
    steps:
    - name: Second Step
      run: echo "${{ env.VAR1 }} Mondo", di nuovo